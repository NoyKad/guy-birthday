<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ברכה מיוחדת</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Varela+Round&family=Rubik:wght@400;600&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    
    body::before {
      content: '🎉🎂🎈🎁🎊✨🎉🎂🎈🎁🎊✨';
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 2.5em;
      animation: float 3s ease-in-out infinite;
      z-index: 0;
    }
    
    body::after {
      content: '🎈🎁🎊✨🎉🎂🎈🎁🎊✨🎉🎂';
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 2.5em;
      animation: float 3s ease-in-out infinite 1.5s;
      z-index: 0;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      padding: 50px 40px;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: slideIn 0.8s ease-out;
    }
    
    .emoji-header {
      font-size: 3.5em;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }
    
    h1 {
      font-family: 'Varela Round', sans-serif;
      font-size: 2.5em;
      color: #667eea;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }
    
    .message {
      font-size: 1.3em;
      line-height: 2;
      color: #444;
      margin: 30px 0;
      white-space: pre-line;
    }
    
    .signature {
      font-size: 1.2em;
      color: #764ba2;
      font-weight: 600;
      margin-top: 30px;
    }
    
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #f093fb;
      animation: confettiFall 3s linear infinite;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-15px);
      }
    }
    
    @keyframes confettiFall {
      to {
        transform: translateY(100vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji-header">🎂🎉🎁</div>
    <h1>גיא היקר! 🎈</h1>
    <div class="message">אם הגעת עד כאן, סימן שלא חיפשת קיצורי דרך.
בדקת, שאלת, וקישרת בין רמזים.
תמשיך לבנות רעיונות, לאתגר את עצמך,
וליהנות מהדרך של חקירה ויצירה.

✨ המון מזל טוב לבר במצווה ✨</div>
    <div class="signature">באהבה רבה, מאתנו 💝</div>
  </div>
</body>
</html>
