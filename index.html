<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>root@server:~#</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Code+Pro:wght@400;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0a0a0a;
      color: #00ff00;
      font-family: 'Source Code Pro', 'Courier New', monospace;
      padding: 20px;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1000;
    }
    
    .crt-effect {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
      pointer-events: none;
      z-index: 999;
    }
    
    .terminal {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
    }
    
    .spinner-container {
      text-align: center;
      margin: 40px 0;
      perspective: 1000px;
    }
    
    .hack-text {
      font-size: 3em;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 30px #ff0000;
      animation: spin3d 3s linear infinite, glitch 0.5s infinite;
      display: inline-block;
      letter-spacing: 5px;
    }
    
    .header {
      margin-bottom: 30px;
      border-bottom: 1px solid #00ff00;
      padding-bottom: 10px;
    }
    
    .prompt {
      color: #00ff00;
      margin: 20px 0 10px 0;
    }
    
    .prompt-user {
      color: #00ff00;
      font-weight: bold;
    }
    
    .prompt-path {
      color: #0080ff;
      font-weight: bold;
    }
    
    .command {
      color: #ffff00;
    }
    
    h3 {
      color: #00ff00;
      font-size: 1.5em;
      margin: 20px 0;
      animation: blink 1s infinite;
    }
    
    ul {
      list-style: none;
      padding-left: 0;
    }
    
    li {
      margin: 8px 0;
      padding: 5px 0;
    }
    
    a {
      color: #00aaff;
      text-decoration: none;
      transition: all 0.3s;
      position: relative;
    }
    
    a:hover {
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
    }
    
    a:before {
      content: '> ';
      color: #00ff00;
      animation: blink 1.5s infinite;
    }
    
    .file-icon {
      margin-right: 10px;
    }
    
    .access-granted {
      color: #00ff00;
      font-size: 0.9em;
      margin-top: 20px;
      animation: fadeIn 2s;
    }
    
    .warning {
      color: #ff0000;
      margin: 20px 0;
      border: 1px solid #ff0000;
      padding: 10px;
      animation: pulseRed 2s infinite;
    }
    
    @keyframes spin3d {
      0% {
        transform: rotateY(0deg) rotateX(0deg);
      }
      100% {
        transform: rotateY(360deg) rotateX(360deg);
      }
    }
    
    @keyframes glitch {
      0%, 100% {
        text-shadow: 
          0 0 10px #ff0000,
          0 0 20px #ff0000,
          0 0 30px #ff0000;
      }
      25% {
        text-shadow: 
          -2px 0 10px #ff0000,
          2px 0 20px #00ff00,
          0 0 30px #ff0000;
      }
      50% {
        text-shadow: 
          2px 0 10px #ff0000,
          -2px 0 20px #0000ff,
          0 0 30px #ff0000;
      }
      75% {
        text-shadow: 
          0 2px 10px #ff0000,
          0 -2px 20px #ff00ff,
          0 0 30px #ff0000;
      }
    }
    
    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @keyframes pulseRed {
      0%, 100% {
        box-shadow: 0 0 5px #ff0000;
      }
      50% {
        box-shadow: 0 0 20px #ff0000;
      }
    }
    
    .matrix-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.05;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="crt-effect"></div>
  <canvas class="matrix-bg" id="matrix"></canvas>
  
  <div class="terminal">
    <div class="spinner-container">
      <div class="hack-text">HACK THE BOX!</div>
    </div>
    
    <div class="warning">
      ⚠️ WARNING: UNAUTHORIZED ACCESS DETECTED ⚠️
    </div>
    
    <div class="prompt">
      <span class="prompt-user">root@server</span>:<span class="prompt-path">~</span># <span class="command">ls -la /</span>
    </div>
    
    <div class="header">
      <h3>Index of /</h3>
    </div>
    
    <ul>
      <li><span class="file-icon">📄</span><a href="README.html">README.html</a></li>
      <li><span class="file-icon">📁</span><a href="logs/">logs/</a></li>
      <li><span class="file-icon">📁</span><a href="assets/">assets/</a></li>
    </ul>
    
    <div class="access-granted">
      [✓] ACCESS GRANTED :: SYSTEM BREACH SUCCESSFUL :: EXPLORING FILES...
    </div>
    
    <div class="prompt">
      <span class="prompt-user">root@server</span>:<span class="prompt-path">~</span># <span style="animation: blink 1s infinite;">_</span>
    </div>
  </div>
  
  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const chars = '01アイウエオカキクケコサシスセソタチツテト';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    
    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#00ff00';
      ctx.font = fontSize + 'px monospace';
      
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    
    setInterval(drawMatrix, 50);
    
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
